<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setzungsverhalten von Böden</title>
<!--
  Animation zur Stunde "Setzungsverhalten bindiger und nichtbindiger Boeden"
  (BG Bautechnik, Klasse 11, Woche 7). Laeuft OFFLINE: keine externen Dateien.

  Steuerung:  Leertaste / Pfeil rechts = weiter   Pfeil links = zurueck
              R = Neustart   W = Szene wiederholen   P = Pause   F = Vollbild
              + / - = Tempo
  Am STOPP-Punkt geht es NUR mit einem Klick auf "Aufloesung" weiter.

  Die Teilchen in den Lupen werden von latex/lupe_geometrie.py erzeugt und
  in den Block GEOMETRIE-BEGINN/-ENDE geschrieben (dieselben wie auf dem
  Arbeitsblatt). Die Kurven sSand/sTon stimmen mit latex/setzung.sty ueberein.

  Didaktik: In Teil A reagiert die Lupe schon LIVE auf jeden Bauabschnitt
  (Sand: wenig Wasser, fliesst sofort ab, kein Druck -- Ton: Wasser kann kaum
  entweichen und steht am Bauende noch unter Druck), aber es gibt noch keine
  Setzungskurve. Die Klasse leitet die Kurve am STOPP aus der Lupe ab.
-->
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --leise: #555555;
    --bar: #1d2733; --bar-ink: #e8eef4; --bar-btn: #2f3d4d; --bar-btn-h: #42566c;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  #buehne { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { width: 100%; height: 100%; display: block; }
  #leiste { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 7px 12px; background: var(--bar); color: var(--bar-ink); font-size: 15px; }
  #leiste button { font: inherit; font-size: 15px; color: var(--bar-ink); background: var(--bar-btn);
                   border: 1px solid #55687d; border-radius: 6px; padding: 6px 11px; cursor: pointer; }
  #leiste button:hover { background: var(--bar-btn-h); }
  #leiste button:disabled { opacity: 0.35; cursor: not-allowed; }
  #leiste .sp { flex: 1 1 auto; }
  #leiste label { display: flex; align-items: center; gap: 6px; }
  #leiste input[type=range] { width: 120px; }
  #szene { opacity: 0.8; white-space: nowrap; }
  #hinweis { color: #ffd479; font-weight: bold; }
  .klickbar { cursor: pointer; }
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="buehne">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Animation Setzungsverhalten">
    <defs>
      <clipPath id="lupeClip" clipPathUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1"/></clipPath>
      <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
      </marker>
    </defs>
    <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
    <g id="root"></g>
  </svg>
</div>
<div id="leiste">
  <button id="bNeu" title="Neustart (R)">⏮ Neustart</button>
  <button id="bZur" title="Zurück (←)">◀ Zurück</button>
  <button id="bWdh" title="Szene wiederholen (W)">↺ Szene wiederholen</button>
  <button id="bPause" title="Pause (P)">⏸ Pause</button>
  <button id="bWeiter" title="Weiter (Leertaste / →)">Weiter ▶</button>
  <span id="hinweis"></span>
  <span class="sp"></span>
  <label>Tempo <input id="tempo" type="range" min="0.25" max="2" step="0.25" value="1"> <span id="tempoW">1×</span></label>
  <span id="szene"></span>
  <button id="bVoll" title="Vollbild (F)">⛶ Vollbild</button>
</div>

// =====================================================================
//  Fachliche Modellkurven (identisch mit latex/setzung.sty)
//  x = Anteil der Zeitachse: 0..XB Bauzeit, XB..XJ Monate, XJ..1 Jahre
//  s = Setzung, gleiche Skalierung fuer beide Boeden (1 = volle Achse)
// =====================================================================
// Bauzeit bewusst kurz: 80 % der Zeitachse liegen NACH dem Bauende
const XB = 0.20, XBR = 0.24, XJ = 0.28;
const last = x => Math.min(x / XB, 1);
function sSand(x) {
  if (x <= XB) return 0.2 * 0.97 * x / XB;
  return 0.2 * (0.97 + 0.03 * (1 - Math.exp(-(x - XB) / 0.008)));
}
function sTon(x) {
  if (x <= XB) return 0.06 * x / XB + 0.03 * (x / XB) ** 2;
  if (x <= XJ) return 0.09 + 0.03 * (x - XB) / (XJ - XB);
  const u = (x - XJ) / (1 - XJ);
  return 0.12 + 0.62 * (1 - Math.exp(-3.2 * u)) + 0.05 * u;
}
const S_END = { sand: sSand(1), ton: sTon(1) };
const sFun = { sand: sSand, ton: sTon };
// Porenwasserueberdruck (0..1): im Sand keiner (das wenige Wasser fliesst
// sofort ab), im Ton steigt er mit der Last und baut sich nur langsam ab
function uFun(boden, x) {
  if (boden === "sand") return 0;
  const sofort = 0.06 * last(x);
  const U = (sTon(x) - sofort) / (S_END.ton - 0.06);
  return Math.max(0, last(x) * (1 - Math.min(1, U)));
}
function zeitText(x) {
  if (x <= XB) return "Bauzeit: Woche " + Math.max(1, Math.ceil(x / XB * 20));
  if (x < XJ) {
    const m = Math.max(1, Math.round((x - XB) / (XJ - XB) * 12));
    return m >= 12 ? "1 Jahr nach Bauende" : m + (m === 1 ? " Monat" : " Monate") + " nach Bauende";
  }
  const j = Math.max(1, Math.round(Math.pow(60, (x - XJ) / (1 - XJ))));
  return j + (j === 1 ? " Jahr" : " Jahre") + " nach Bauende";
}

// Sand: Ziel der Kornbewegung ist eine dichtere Packung (fuer die Darstellung
// bewusst uebertrieben). Die Lupe wird senkrecht gestaucht, dann ruecken die

const EPS_SAND = 0.15;
// freieste Stelle zwischen den Koernern der dichten Packung nahe (x, y)
function porenStelle([x0, y0]) {
  const D = dichtePackung();
  function frei(x, y) {
    let best = 9;
    GEO.sand.forEach((k, i) => {
      const dx = x - (k.x + D[i][0]), dy = y - (-k.y + D[i][1]), d = Math.hypot(dx, dy);
      if (d > 0.6 || d < 1e-6) return;

    if (Math.hypot(x, y) > 0.8) continue;

  }

}

function dichtePackung() {

  K.forEach(k => { k.x = k.zx = k.x0; k.y = k.zy = k.y0 * (1 - EPS_SAND); });

    for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {

      a.x += dx * f; a.y += dy * f; b.x -= dx * f; b.y -= dy * f;

    schritt(true);
    for (const k of K) { k.x += (k.zx - k.x) * 0.012; k.y += (k.zy - k.y) * 0.012; }   // nicht davonwandern

// Stellen fuer die Druckzeichen im Ton: moeglichst weit weg von den Plaettchen,
// gleichmaessig ueber die Lupe verteilt (SVG-Koordinaten, Lupenradius = 1)
function druckPunkte() {
  const h = GEO.huelle, d = GEO.dicke;
  function frei(x, y) {           // x, y in GEO-Koordinaten (y nach oben)
    let best = 9;
    for (const p of GEO.platten) {
      const a = p.a * Math.PI / 180, dx = x - p.x, dy = y - p.y;
      const u = dx * Math.cos(a) + dy * Math.sin(a), v = -dx * Math.sin(a) + dy * Math.cos(a);

  return raster.map(([cx, cy]) => {
    let bester = [cx, cy], bw = -1;

// Wasser in der Lupe --------------------------------------------------
// Sand: WENIG Wasser, fliesst sofort und ungehindert ab -> wenige, kurze Pfeile,
//       die mit jedem Bauabschnitt (Lastschritt) erscheinen und gleich wieder
//       verschwinden. Kein Druck, keine Farbaenderung.
// Ton:  VIEL Wasser, kann kaum entweichen -> waehrend der Bauzeit nur vereinzelte,
//       sehr langsame Tropfen; nach Bauende (Teil B) Tropfen im Takt der Konsolidation.
// b0, b1: Beginn und Ende der Bauzeit in Szenensekunden
function wasserPlan(boden, b0, b1, xVonT, dauer, seed) {
  const r = rnd(seed), plan = [];

    let x = 0, y = 0;
    for (let k = 0; k < 80; k++) {
      x = (r() * 2 - 1) * 0.8; y = (r() * 2 - 1) * 0.8;
      if (Math.hypot(x, y) > 0.82) continue;
      if (boden !== "sand" || GEO.sand.every(g => Math.hypot(x - g.x, -y - g.y) > g.r + 0.05)) break;
    }
    return [x, y];
  }

    // je Bauabschnitt: kurzer Schub aus drei Pfeilen beim Aufbringen der Last, dann noch einer
    for (const [a, b] of ABSCHNITTE) for (const [q, dt] of [[0.04, 0], [0.04, 0.1], [0.04, 0.2], [0.55, 0]]) {
      const [x, y] = ort();
      const w = Math.max(-50, Math.min(50, x * 60)) + (r() - 0.5) * 30;   // nach oben und aussen
      plan.push({ art: "pfeil", t0: tBau(a + (b - a) * q) + dt, x, y, w });
    }
    return plan;
  }
  for (const p of [0.35, 0.8]) { const [x, y] = ort(); plan.push({ art: "tropfen", t0: tBau(p), x, y, dx: (r() - 0.5) * 0.25 }); }

    if (!pr) continue;
    const [x, y] = ort();
    plan.push({ art: "tropfen", t0: pr[0], x, y, dx: (r() - 0.5) * 0.25 });
  }
  return plan;
}
function wasserZeichnen(schicht, plan) {
  return plan.map(p => {

      el("path", { d: "M-0.048,-0.08 L0,-0.145 L0.048,-0.08 Z", fill: "#0d4f9c", stroke: "#0d4f9c", "stroke-width": 0.01, "stroke-linejoin": "round" }, g);

// c: Zusammendrueckung der Lupe, punkt: Verschiebung -- Pfeile und Tropfen wandern mit den Teilchen
function wasserSetzen(liste, t, c, punkt) {
  for (const d of liste) {
    const [px, py] = punkt(d.x, d.y, c);
    const a = t - d.t0, pf = d.art === "pfeil", leben = pf ? 0.8 : 4.5;

function lastDiagramm(g, d) {
  // d: {x0, y0 (t-Achse), W, H}

  text(gr, X(XB), d.y0 - d.H - 16, "Bauende", { "font-size": 22, "text-anchor": "middle", "font-weight": "bold", fill: F.leise });
  el("line", { x1: d.x0, y1: d.y0, x2: X(1) + 30, y2: d.y0, stroke: "#111", "stroke-width": 3.5, "marker-end": "url(#pfeil)" }, gr);
  el("line", { x1: d.x0, y1: d.y0, x2: d.x0, y2: d.y0 - d.H - 26, stroke: "#111", "stroke-width": 3.5, "marker-end": "url(#pfeil)" }, gr);
  text(gr, d.x0 - 12, d.y0 - d.H - 8, "Last F", { "font-size": 24, "text-anchor": "end", "font-weight": "bold" });
  text(gr, X(1) + 40, d.y0 + 8, "Zeit t", { "font-size": 24, "font-weight": "bold" });
  zeitAchseTeil(gr, d, d.y0, d.labels, d.labelY);
  const kurve = el("path", { fill: "none", stroke: "#111", "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round" }, gr);
  const punkt = el("circle", { r: 9, fill: "#111", opacity: 0 }, gr);
  return {
    g: gr,
    set(xc) {
      const pts = [];
      for (let i = 0; i <= 60; i++) { const x = xc * i / 60; pts.push([X(x), Y(last(x))]); }
      if (xc > XB) { pts.splice(0, pts.length); pts.push([X(0), Y(0)], [X(XB), Y(1)], [X(xc), Y(1)]); }
      kurve.setAttribute("d", xc > 0 ? pathFrom(pts) : "");
      punkt.setAttribute("cx", X(xc)); punkt.setAttribute("cy", Y(last(xc))); setOp(punkt, xc > 0 && xc < 1 ? 1 : 0);
    }

}

  return { g: gr, X, Y, kurve };
}

// Stilisierter Schiefer Turm (Ursprung: Mitte der Basis, nach oben negativ)
function turm(g, H, stock) {
  const gr = el("g", {}, g);
  const B = 0.27 * H, hg = H / 8.6;
  const teile = [];
  for (let i = 0; i < 7; i++) {
    const yu = i === 0 ? 0 : 1.4 * hg + (i - 1) * hg, yo = i === 0 ? 1.4 * hg : yu + hg;
    const s = el("g", {}, gr);
    el("rect", { x: -B / 2, y: -yo, width: B, height: yo - yu, fill: "#fbfaf6", stroke: "#222", "stroke-width": Math.max(2, H / 180) }, s);
    for (let k = 0; k < 5; k++) {
      const ax = -B / 2 + 0.07 * B + k * 0.19 * B, rr = 0.07 * B;
      el("path", { d: `M${ax},${-yu - 0.08 * hg} L${ax},${-yo + 0.42 * hg} A${rr},${rr} 0 0 1 ${ax + 2 * rr},${-yo + 0.42 * hg} L${ax + 2 * rr},${-yu - 0.08 * hg}`, fill: "none", stroke: "#444", "stroke-width": Math.max(1.2, H / 320) }, s);
    }
    el("line", { x1: -B / 2 - 0.04 * B, x2: B / 2 + 0.04 * B, y1: -yo, y2: -yo, stroke: "#222", "stroke-width": Math.max(2.5, H / 140) }, s);
    teile.push(s);
  }
  const yg = 1.4 * hg + 6 * hg;
  const glocke = el("g", {}, gr);
  el("rect", { x: -0.37 * B, y: -yg - 1.05 * hg, width: 0.74 * B, height: 1.05 * hg, fill: "#fbfaf6", stroke: "#222", "stroke-width": Math.max(2, H / 180) }, glocke);
  for (let k = 0; k < 3; k++) {
    const ax = -0.28 * B + k * 0.2 * B, rr = 0.07 * B;
    el("path", { d: `M${ax},${-yg - 0.1 * hg} L${ax},${-yg - 0.55 * hg} A${rr},${rr} 0 0 1 ${ax + 2 * rr},${-yg - 0.55 * hg} L${ax + 2 * rr},${-yg - 0.1 * hg}`, fill: "none", stroke: "#444", "stroke-width": Math.max(1.2, H / 320) }, glocke);
  }
  teile.push(glocke);
  return {
    g: gr, B,
    stockwerke(n) { teile.forEach((t, i) => setOp(t, i < n ? 1 : 0)); }
  };
}

function teilA(boden) {
  const sand = boden === "sand";

      s.gLupe = el("g", {}, root);
      s.lupe = lupe(s.gLupe, boden, false);
      s.lupe.glow.setAttribute("stroke", sand ? F.fokus : F.druckVoll);
      s.plan = wasserZeichnen(s.lupe.tropfenSchicht, wasserPlan(boden, A.bau0, A.bau1, null, 0, sand ? 21 : 22));
      s.lupeHinweis = text(s.gLupe, G.Lx, 128, "", { "font-size": 28, "text-anchor": "middle", "font-weight": "bold", fill: F.ink, opacity: 0 });
      if (!sand) s.druck = druckLeiste(s.gLupe);
      s.gDia = el("g", {}, root);
      s.last = lastDiagramm(s.gDia, { x0: 170, y0: 850, W: 1250, H: 150, labels: true, labelY: 885 });
      // nach Bauende bleibt die Last gleich -- gestrichelt, die Szene selbst endet am Bauende
      s.lastWeiter = el("g", { opacity: 0 }, s.gDia);
      el("line", { x1: 170 + XB * 1250 + 14, x2: 170 + 1250, y1: 700, y2: 700, stroke: "#111", "stroke-width": 5, "stroke-dasharray": "3 13", "stroke-linecap": "round" }, s.lastWeiter);
      text(s.lastWeiter, 170 + 0.62 * 1250, 686, "danach bleibt die Last gleich", { "font-size": 22, "text-anchor": "middle", fill: F.leise, "font-weight": "bold" });

                      { "font-size": 24, fill: F.akzent, "font-weight": "bold", opacity: 0 });

    },
    update(s, t) {
      // 1,6-9,6 s Bau in vier Abschnitten, ab 10 s Fokus auf die Lupe am Bauende
      const x = XB * seg(t, A.bau0, A.bau1), sv = sFun[boden](x), c = sv / S_END[boden], u = uFun(boden, x);
      s.haus.set(x / XB, sv * G.spx);

      s.last.set(x);
      s.lupe.compress(c);
      s.lupe.setKlein(bodenDy(sv, G.lx, G.ly));
      s.lupe.wasser(u, c);
      wasserSetzen(s.plan, t, c, s.lupe.punkt);
      if (s.druck) { s.druck.set(u); setOp(s.druck.g, glatt(seg(x, 0.004, 0.03))); }
      s.uhr.set(t < A.bau0 ? "Baubeginn" : t >= A.bau1 ? "Bauende – Haus fertig" : zeitText(Math.max(x, 0.001)), false);
      s.lupe.beschr.forEach((b, i) => setOp(b, glatt(seg(t, 0.2 + i * 0.3, 0.8 + i * 0.3))));
      setOp(s.lastWeiter, glatt(seg(t, A.bau1, A.bau1 + 0.6)));

      const ende = t >= A.fokus;
      s.lupeHinweis.textContent = !ende ? "Blick in den Boden – während der Bauzeit"

      setOp(s.lupeHinweis, ende ? f : glatt(seg(t, 0, 0.6)));
      setOp(s.gleich, glatt(seg(t, 1, 2)) * (1 - glatt(seg(t, A.bau1 - 1, A.bau1))));
    }
  };
}

function teilB(boden) {

      s.lupe.caption.setAttribute("y", G.Ly + G.LR + 32);
      s.fluss = text(s.gLupe, G.Lx, G.Ly - G.LR - 20, "", { "font-size": 28, "text-anchor": "middle", "font-weight": "bold", fill: "#0d4f9c" });
      s.plan = wasserZeichnen(s.lupe.tropfenSchicht, wasserPlan(boden, T.bau0, T.bau1, xVonT, T.dauer, sand ? 21 : 22));
      s.gDia = el("g", {}, root);
      s.last = lastDiagramm(s.gDia, { x0: 170, y0: 652, W: 1250, H: 50, labels: true, labelY: 680 });
      // Szene 3 und 4: identisches Diagramm, also dieselbe Skalierung
      s.dia = setzungsDiagramm(s.gDia, { x0: 170, y0: 702, W: 1250, H: 180, sMax: 0.95, zeitText: false, bauendeOben: 50 });
      s.kurve = s.dia.kurve(boden);
      if (!sand) {
        s.kriech = el("g", { opacity: 0 }, s.gDia);
        text(s.kriech, s.dia.X(0.995), s.dia.Y(S_END.ton) + 34, "noch nicht ganz flach: Kriechen", { "font-size": 21, "text-anchor": "end", fill: F.ton, "font-style": "italic" });
      }
      // Fazit im Diagramm
      s.fazit = el("g", { opacity: 0 }, s.gDia);
      const fx = 1415, fy = sand ? 790 : 752;
      const ft = sand ? "geringe Setzung – mit Bauende abgeschlossen" : "große Setzung – über Jahre,\nbis das Wasser herausgedrückt ist";
      const fr = el("rect", { rx: 12, fill: sand ? F.sandFl : F.tonFl, stroke: sand ? F.sand : F.ton, "stroke-width": 4 }, s.fazit);
      const ftt = text(s.fazit, fx - 20, fy, ft, { "font-size": sand ? 32 : 30, "font-weight": "bold", "text-anchor": "end" });
      s.fazitBox = () => { try { const b = ftt.getBBox(); fr.setAttribute("x", b.x - 20); fr.setAttribute("y", b.y - 8); fr.setAttribute("width", b.width + 40); fr.setAttribute("height", b.height + 16); } catch (e) {} };
      s.fazitBox(); requestAnimationFrame(s.fazitBox);
      // Zeitraffer-Banner: Bauzeit -> Monate -> Jahre, der Wechsel soll auffallen
      s.raffer = el("g", { opacity: 0 }, root);
      s.rafferR = el("rect", { x: 715, y: 22, width: 370, height: 60, rx: 12, fill: "#2f3d4d", stroke: "#fff", "stroke-width": 0 }, s.raffer);
      s.rafferT = text(s.raffer, 900, 63, "", { "font-size": 30, "font-weight": "bold", fill: "#fff", "text-anchor": "middle" });
      s.start = el("g", { opacity: 0 }, root);
      el("rect", { x: 250, y: 380, width: 1100, height: 120, rx: 18, fill: "#fff", stroke: F.fokus, "stroke-width": 6 }, s.start);
      text(s.start, 800, 455, "Noch einmal im Zeitraffer – jetzt mit Setzungskurve", { "font-size": 40, "font-weight": "bold", "text-anchor": "middle" });
      return s;
    },
    update(s, t) {
      const x = xVonT(t), sv = sFun[boden](x), c = sv / S_END[boden], u = uFun(boden, x);
      s.haus.set(clamp01(x / XB), sv * G.spx);
      s.boden.set(sv, x > 0.003);
      s.last.set(x);
      s.kurve.set(x);
      s.lupe.compress(c);
      s.lupe.setKlein(bodenDy(sv, G.lx, G.ly));
      s.lupe.wasser(u, c);
      s.druck.set(u);
      wasserSetzen(s.plan, t, c, s.lupe.punkt);
      setOp(s.start, glatt(seg(t, 0, 0.3)) * (1 - glatt(seg(t, 1.0, 1.4))));
      const modus = t < T.bau1 ? false : t < T.mon1 ? "monate" : true;
      s.uhr.set(t < T.bau0 ? "Baubeginn" : zeitText(Math.max(x, 0.001)), modus);
      // Banner
      const phase = t < T.bau1 ? 0 : t < T.mon1 ? 1 : 2;
      s.rafferT.textContent = ["⏩ Bauzeit im Zeitraffer", "⏩ Zeitraffer: MONATE", "⏩⏩ Zeitraffer: JAHRE"][phase];
      s.rafferR.setAttribute("fill", ["#2f3d4d", F.monate, F.ton][phase]);
      const puls = (t > T.bau1 && t < T.bau1 + 0.8) || (t > T.mon1 && t < T.jahr0 + 0.6);
      s.rafferR.setAttribute("stroke-width", puls ? 3 + 3 * (0.5 + 0.5 * Math.sin(t * 14)) : 0);
      s.rafferR.setAttribute("stroke", puls ? F.fokus : "#fff");
      setOp(s.raffer, glatt(seg(t, T.bau0, T.bau0 + 0.4)) * (1 - glatt(seg(t, T.jahr1, T.jahr1 + 0.5))));
      // Text ueber der Lupe
      let fl = "", fa = "#0d4f9c";
      if (t >= T.bau0) {
        if (sand) fl = x < XB ? "wenig Wasser – fließt sofort ab, kein Druck" : "Ruhe – kein Wasser fließt mehr";
        else if (x < XB) { fl = "Wasser kann kaum entweichen – steht unter Druck"; fa = F.druck; }
        else fl = x < 0.97 ? "Wasser wird langsam herausgedrückt …" : "fast zur Ruhe gekommen";
      }
      s.fluss.textContent = fl; s.fluss.setAttribute("fill", fa);
      if (!sand) setOp(s.kriech, glatt(seg(t, T.fazit + 1, T.fazit + 2)));
      setOp(s.fazit, glatt(seg(t, T.fazit, T.fazit + 0.6)));
    }
  };
}
SZENEN.push(teilB("sand"));
SZENEN.push(teilB("ton"));

// ---------- Szene 5: Vergleich und Pisa --------------------------------
SZENEN.push({
  name: "Vergleich und Pisa", dauer: 27,
  bauen(root) {
    const s = {};
    titel(root, "TEIL B · VERGLEICH", "Beide Böden – gleiche Skalierung");
    s.uhr = null;
    s.gDia = el("g", {}, root);
    s.dia = setzungsDiagramm(s.gDia, { x0: 150, y0: 205, W: 690, H: 380, sMax: 0.95, labels: true, kurz: true, labelY: 185, bauendeText: true, bauendeOben: 0, bauzeitBand: true });
    text(s.gDia, 150, 650, "Zeitachse nicht maßstäblich · Setzung bei beiden Böden gleich skaliert", { "font-size": 20, fill: F.leise });
    s.kS = s.dia.kurve("sand", 8); s.kT = s.dia.kurve("ton", 8);
    s.lS = el("g", { opacity: 0 }, s.gDia);
    text(s.lS, s.dia.X(0.45), s.dia.Y(S_END.sand) - 16, "Sand: mit Bauende fertig", { "font-size": 25, "font-weight": "bold", fill: F.sand });
    s.lT = el("g", { opacity: 0 }, s.gDia);
    text(s.lT, s.dia.X(0.40), s.dia.Y(0.86), "Ton: kleine Sofortsetzung,\ndann Konsolidation über\nJahre bis Jahrzehnte", { "font-size": 25, "font-weight": "bold", fill: F.ton });
    // Pfeil fuer den Unterschied der Endsetzungen
    s.diff = el("g", { opacity: 0 }, s.gDia);
    const xa = s.dia.X(1) + 12;
    el("line", { x1: xa, x2: xa, y1: s.dia.Y(S_END.sand), y2: s.dia.Y(S_END.ton), stroke: "#111", "stroke-width": 3, "marker-start": "url(#pfeil)", "marker-end": "url(#pfeil)" }, s.diff);
    text(s.diff, xa + 12, s.dia.Y((S_END.sand + S_END.ton) / 2), "Ton\nstärker\nzusammen-\ndrückbar", { "font-size": 21, "font-weight": "bold" });
    s.warum = el("g", { opacity: 0 }, root);
    const kz = [
      [F.sand, F.sandFl, "Sand:", "große Poren, k ≈ 10⁻⁴ m/s → Wasser sofort weg"],
      [F.ton, F.tonFl, "Ton:", "winzige Poren, k ≈ 10⁻⁹ m/s → Wasser braucht Jahre"]
    ];
    kz.forEach(([r, f, a, b], i) => {
      el("rect", { x: 60, y: 680 + i * 88, width: 850, height: 72, rx: 12, fill: f, stroke: r, "stroke-width": 3 }, s.warum);
      text(s.warum, 80, 726 + i * 88, a, { "font-size": 27, "font-weight": "bold" });
      text(s.warum, 160, 726 + i * 88, b, { "font-size": 26 });
    });
    // Pisa
    s.gPisa = el("g", { opacity: 0 }, root);
    const P = { x: 1240, y: 560 };
    el("rect", { x: 960, y: 115, width: 600, height: 6, fill: "none" }, s.gPisa);
    text(s.gPisa, 1260, 150, "Zurück nach Pisa", { "font-size": 34, "font-weight": "bold", "text-anchor": "middle" });
    // Bodenschichten: weicher Ton, unter der Suedseite (rechts) stärker zusammendrückbar
    s.schicht = el("path", { fill: F.tonFl, stroke: F.ton, "stroke-width": 3 }, s.gPisa);
    el("rect", { x: 940, y: P.y, width: 620, height: 60, fill: F.sandFl, opacity: 0.9 }, s.gPisa);
    text(s.gPisa, 955, P.y + 40, "Schluff, Sand", { "font-size": 21, fill: F.sandRand, "font-weight": "bold" });
    s.tonText = text(s.gPisa, 955, P.y + 150, "weicher, wassergesättigter Ton", { "font-size": 22, fill: F.ton, "font-weight": "bold" });
    el("line", { x1: 940, x2: 1560, y1: P.y + 18, y2: P.y + 18, stroke: F.wasser, "stroke-width": 3 }, s.gPisa);
    el("polygon", { points: `1520,${P.y + 18} 1510,${P.y + 2} 1530,${P.y + 2}`, fill: F.wasser }, s.gPisa);
    el("rect", { x: 940, y: P.y, width: 620, height: 300, fill: "none", stroke: "#444", "stroke-width": 2 }, s.gPisa);
    el("line", { x1: 930, x2: 1570, y1: P.y, y2: P.y, stroke: "#222", "stroke-width": 4 }, s.gPisa);
    text(s.gPisa, 950, P.y - 12, "Norden", { "font-size": 22, fill: F.leise, "font-weight": "bold" });
    text(s.gPisa, 1550, P.y - 12, "Süden", { "font-size": 22, fill: F.leise, "font-weight": "bold", "text-anchor": "end" });
    s.lot = el("line", { x1: P.x, x2: P.x, y1: P.y, y2: P.y - 400, stroke: F.linie, "stroke-width": 3, "stroke-dasharray": "10 8" }, s.gPisa);
    s.dreh = el("g", {}, s.gPisa);
    s.turm = turm(s.dreh, 360);
    s.jahr = text(s.gPisa, 950, 240, "", { "font-size": 36, "font-weight": "bold" });
    s.jahrInfo = text(s.gPisa, 950, 278, "", { "font-size": 22, fill: F.leise });
    s.pisaText = el("g", { opacity: 0 }, root);
    el("rect", { x: 930, y: 868 - 2, width: 0, height: 0 }, s.pisaText);
    s.P = P;
    return s;
  },
  update(s, t) {
    // 0-3.5 Sand, 3.5-8 Ton, 8.5 Beschriftung, 11 Fokus Pisa
    const xS = glatt(seg(t, 0.3, 3.3)), xT = glatt(seg(t, 3.8, 8));
    s.kS.set(xS); s.kT.set(xT);
    setOp(s.lS, glatt(seg(t, 3.0, 3.6)));
    setOp(s.lT, glatt(seg(t, 7.6, 8.2)));
    setOp(s.diff, glatt(seg(t, 8.4, 9)));
    setOp(s.warum, glatt(seg(t, 9.2, 9.9)));
    const f = glatt(seg(t, 11, 12));
    setOp(s.gDia, lerp(1, 0.3, f)); setOp(s.warum, glatt(seg(t, 9.2, 9.9)) * lerp(1, 0.3, f));
    setOp(s.gPisa, f);
    // Turmgeschichte: 1173 Baubeginn, 1178 Pause, 1272 Weiterbau, 1278 Pause, ~1370 fertig, 1990 ~5,5°
    const tp = seg(t, 12, 25);
    const stuetz = [[0, 1173], [0.08, 1178], [0.22, 1272], [0.3, 1278], [0.45, 1370], [1, 1990]];
    let jahr = 1173;
    for (let i = 1; i < stuetz.length; i++) if (tp <= stuetz[i][0]) { const a = stuetz[i - 1], b = stuetz[i]; jahr = lerp(a[1], b[1], (tp - a[0]) / (b[0] - a[0])); break; }
    if (tp >= 1) jahr = 1990;
    const stock = jahr < 1178 ? 1 + Math.floor((jahr - 1173) / 5 * 3) : jahr < 1272 ? 4 : jahr < 1278 ? 4 + Math.floor((jahr - 1272) / 6 * 3) : jahr < 1360 ? 7 : 8;
    s.turm.stockwerke(t < 12 ? 8 : Math.min(8, stock));
    // Neigung waechst mit der Konsolidation des Tons (qualitativ), Endwert rund 5,5°
    const neig = t < 12 ? 0 : 5.5 * (jahr <= 1370 ? 0.4 * (jahr - 1173) / 197 : 0.4 + 0.6 * (1 - Math.exp(-(jahr - 1370) / 260)) / (1 - Math.exp(-620 / 260)));
    const sinken = neig / 5.5 * 26;
    s.dreh.setAttribute("transform", `translate(${s.P.x},${s.P.y + sinken}) rotate(${neig.toFixed(3)})`);
    s.jahr.textContent = t < 12 ? "" : Math.round(jahr) + (tp >= 1 ? ": rund 5,5°" : "");
    let info = "";
    if (t >= 12) {
      if (jahr < 1178) info = "Baubeginn";
      else if (jahr < 1272) info = "Baupause –\nder Ton konsolidiert";
      else if (jahr < 1278) info = "Weiterbau";
      else if (jahr < 1360) info = "Baupause –\nder Ton konsolidiert";
      else if (jahr < 1375) info = "Glockenstube fertig";
      else info = "Konsolidation\ngeht weiter …";
    }
    if (s.jahrInfo.__info !== info) {
      s.jahrInfo.__info = info;
      while (s.jahrInfo.firstChild) s.jahrInfo.removeChild(s.jahrInfo.firstChild);
      info.split("\n").forEach((z, i) => { const ts = el("tspan", { x: 950, dy: i ? "1.2em" : 0 }, s.jahrInfo); ts.textContent = z; });
    }
    // weiche Tonschicht: unter der Suedseite staerker eingedrueckt
    const P = s.P, e = sinken;
    const d = `M940,${P.y + 60} L${P.x - 140},${P.y + 60} Q${P.x},${P.y + 60 + e * 0.5} ${P.x + 160},${P.y + 60 + e * 1.4} L1560,${P.y + 62} L1560,${P.y + 300} L940,${P.y + 300} Z`;
    s.schicht.setAttribute("d", d);
    setOp(s.tonText, 1);
  }
});

// Abschlusstext Pisa als eigener Schlussteil der Szene 5
(function () {
  const sz = SZENEN[SZENEN.length - 1];
  const bauenAlt = sz.bauen, updateAlt = sz.update;
  sz.bauen = function (root) {
    const s = bauenAlt(root);
    s.schluss = el("g", { opacity: 0 }, root);
    el("rect", { x: 940, y: 870 - 80, width: 0, height: 0 }, s.schluss);
    const box = el("g", {}, s.schluss);
    el("rect", { x: 60, y: 660, width: 850, height: 220, rx: 14, fill: "#fff", stroke: F.ton, "stroke-width": 4 }, box);
    text(box, 85, 708, "Pisa: weicher, wassergesättigter Ton.", { "font-size": 28, "font-weight": "bold", fill: F.ton });
    text(box, 85, 752, "Porenwasser kann nur langsam entweichen →\nder Turm setzt sich über Jahrhunderte.\nUnter der Südseite stärker → er neigt sich.", { "font-size": 27 });
    return s;
  };
  sz.update = function (s, t) {
    updateAlt(s, t);
    const f = glatt(seg(t, 25, 26));
    setOp(s.schluss, f);
    if (f > 0) setOp(s.warum, 0);
  };
})();

// =====================================================================
//  Ablaufsteuerung
// =====================================================================
const root = document.getElementById("root");
let aktiv = 0, zeit = 0, pause = false, tempo = 1, zustand = null, vorher = null;
const ui = {
  neu: document.getElementById("bNeu"), zur: document.getElementById("bZur"), wdh: document.getElementById("bWdh"),
  pause: document.getElementById("bPause"), weiter: document.getElementById("bWeiter"), voll: document.getElementById("bVoll"),
  tempo: document.getElementById("tempo"), tempoW: document.getElementById("tempoW"), szene: document.getElementById("szene"),
  hinweis: document.getElementById("hinweis")
};
function gehe(i) {
  aktiv = Math.max(0, Math.min(SZENEN.length - 1, i));
  zeit = 0; pause = false;
  while (root.firstChild) root.removeChild(root.firstChild);
  zustand = SZENEN[aktiv].bauen(root);
  // dezente Szenenanzeige in der Buehne
  text(root, 1580, 890, `${aktiv + 1}/${SZENEN.length}`, { "font-size": 18, fill: "#9a9a9a", "text-anchor": "end" });
  SZENEN[aktiv].update(zustand, 0);
  ui.szene.textContent = `Szene ${aktiv + 1}/${SZENEN.length} · ${SZENEN[aktiv].name}`;
  ui.weiter.disabled = aktiv === STOPP_INDEX || aktiv === SZENEN.length - 1;
  ui.zur.disabled = aktiv === 0;
  ui.hinweis.textContent = aktiv === STOPP_INDEX ? "Weiter nur über „Auflösung ▶“" : "";
  ui.pause.textContent = "⏸ Pause";
}
function weiter() {
  if (aktiv === STOPP_INDEX) {               // Stopp darf NIE uebersprungen werden
    ui.hinweis.textContent = "Bitte auf „Auflösung ▶“ klicken";
    zustand && zustand.knopf && zustand.knopf.setAttribute("fill", "#b3261e");
    setTimeout(() => zustand && zustand.knopf && zustand.knopf.setAttribute("fill", F.akzent), 350);
    return;
  }
  if (aktiv < SZENEN.length - 1) gehe(aktiv + 1);
}
function zurueck() { if (aktiv > 0) gehe(aktiv - 1); }
function pauseUm() { pause = !pause; ui.pause.textContent = pause ? "▶ Fortsetzen" : "⏸ Pause"; }
function setTempo(v) { tempo = Math.max(0.25, Math.min(2, v)); ui.tempo.value = tempo; ui.tempoW.textContent = tempo.toLocaleString("de-DE") + "×"; }
function vollbild() {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
ui.neu.onclick = () => gehe(0);
ui.zur.onclick = zurueck;
ui.wdh.onclick = () => gehe(aktiv);
ui.pause.onclick = pauseUm;
ui.weiter.onclick = weiter;
ui.voll.onclick = vollbild;
ui.tempo.oninput = () => setTempo(parseFloat(ui.tempo.value));
// Knoepfe nach dem Klick entfokussieren, damit die Leertaste nicht den Knopf erneut ausloest
document.querySelectorAll("#leiste button").forEach(b => b.addEventListener("mouseup", () => b.blur()));
document.addEventListener("keydown", ev => {
  if (ev.target && ev.target.tagName === "INPUT") { if (ev.key !== " ") return; }
  switch (ev.key) {
    case " ": case "ArrowRight": case "PageDown": ev.preventDefault(); weiter(); break;
    case "ArrowLeft": case "PageUp": ev.preventDefault(); zurueck(); break;
    case "r": case "R": gehe(0); break;
    case "w": case "W": gehe(aktiv); break;
    case "p": case "P": pauseUm(); break;
    case "f": case "F": vollbild(); break;
    case "+": setTempo(tempo + 0.25); break;
    case "-": setTempo(tempo - 0.25); break;
  }
});
function schleife(ts) {
  if (vorher === null) vorher = ts;
  const dt = Math.min(0.1, (ts - vorher) / 1000); vorher = ts;
  const sz = SZENEN[aktiv];
  if (!pause && zeit < sz.dauer || sz.stopp) {
    if (!pause) zeit = sz.stopp ? zeit + dt : Math.min(sz.dauer, zeit + dt * tempo);
    sz.update(zustand, zeit);
  }
  requestAnimationFrame(schleife);
}
// Pruefhilfe (nur fuer Tests): Szene i zum Zeitpunkt t zeigen
window.__zeige = (i, t) => { gehe(i); zeit = t; pause = true; SZENEN[i].update(zustand, t); ui.pause.textContent = "▶ Fortsetzen"; };
window.__status = () => ({ aktiv, zeit, pause, tempo, stopp: STOPP_INDEX, n: SZENEN.length });
gehe(0);
requestAnimationFrame(schleife);
</script>
