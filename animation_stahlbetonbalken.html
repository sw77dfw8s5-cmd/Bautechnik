<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stahlbetonbalken unter Last</title>
<!--
  Durchbiegung und Biegerisse bei Stahlbetonbalken
  Lernfeld 4 "Stahlbetonbauteile herstellen", Lernsituation 4.1
  Zimmerer, 1. Ausbildungsjahr – Walter-Gropius-Schule

  Eine Datei, offline lauffähig (HTML, CSS, JavaScript, SVG inline).
  Einsatz: erst NACH dem Zeichnen, als Kontrolle der eigenen Darstellung.

  Modell (stark vereinfacht, Verformung und Rissbreiten überhöht):
  - 28 mögliche Rissstellen mit gleichem Abstand zwischen den Auflagern.
  - Biegung (Moment) bezogen auf ihren Größtwert in Feldmitte:
    Einzellast dreieckig, Streckenlast als Parabel; beide gleich groß in der Mitte.
  - Ein Riss entsteht nur, wo die Biegung über der Rissgrenze (0,4) liegt.
    Seine Öffnung wächst mit dem Überschuss, in Feldmitte ist sie am größten.
  - Rissneigung: Mitte senkrecht, zum Rand des gerissenen Bereichs hin
    zunehmend schräg; das untere Ende liegt näher am Auflager.
  - Ungerissene Bereiche bleiben ein geschlossener Balken.

  Tastatur: Leertaste = Abspielen/Pause, Pfeil rechts = Vor,
  Pfeil links = Zurück, R = Neustart.

  URL-Parameter (für feste Ansichten und die Prüfung):
    ?phase=1..4  &t=0..1  &last=strecke|einzel  &bewehrung=1|0
    &kraefte=1|0  &beschriftung=1|0  &momente=1|0  &play=1  &pruef=1
-->
<style>
  :root {
    --wgs-blau: #004D80;
    --wgs-blau-hell: #e6eef4;
    --text: #111;
    --grau: #555;
    --druck: #1565c0;
    --zug: #c62828;
    --stahl: #e07b00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .seite { max-width: 1500px; margin: 0 auto; padding: 10px 20px 12px; }

  .kopf { display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; border-bottom: 3px solid var(--wgs-blau); padding-bottom: 8px; }
  .kopf h1 { margin: 0; font-size: clamp(20px, 2.3vw, 30px); line-height: 1.15; color: var(--wgs-blau); }
  .kopf .unterzeile { margin: 3px 0 0; font-size: clamp(13px, 1.2vw, 16px); color: #333; }
  .kopf .logo { height: clamp(16px, 2.2vw, 28px); width: auto; flex: none; margin-bottom: 4px; }

  .phasen { display: flex; gap: 8px; margin: 10px 0 4px; }
  .phasen button { flex: 1; min-height: 48px; border: 2px solid #c6d4df; background: #fff;
    border-radius: 10px; font: inherit; font-size: clamp(14px, 1.35vw, 18px); font-weight: 600;
    color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 6px 8px; }
  .phasen .nr { display: inline-grid; place-items: center; width: 30px; height: 30px;
    border-radius: 50%; background: var(--wgs-blau-hell); color: var(--wgs-blau); font-weight: 700; flex: none; }
  .phasen button.fertig .nr { background: var(--wgs-blau); color: #fff; }
  .phasen button.aktiv { border-color: var(--wgs-blau); background: var(--wgs-blau); color: #fff; }
  .phasen button.aktiv .nr { background: #fff; color: var(--wgs-blau); }

  .erklaerung { min-height: 4.4em; margin: 6px 0 0; }
  .erklaerung h2 { margin: 0 0 3px; font-size: clamp(20px, 2.1vw, 28px); color: var(--wgs-blau); }
  .erklaerung p { margin: 0; font-size: clamp(16px, 1.6vw, 22px); line-height: 1.35; }

  .buehne { position: relative; }
  #grafik { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; }
  @media (min-width: 900px) and (min-height: 620px) {
    .seite { height: 100vh; display: flex; flex-direction: column; }
    .buehne { flex: 1 1 0; min-height: 240px; }
    #grafik { height: 100%; }
  }

  .legende { list-style: none; display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 22px; margin: 4px 0 0; padding: 0; font-size: 16px; }
  .legende li { display: inline-flex; align-items: center; gap: 8px; }
  .legende .fl { width: 30px; height: 16px; border: 1.5px solid #555; flex: none; }

  .steuerung { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .steuerung button { min-height: 54px; min-width: 140px; font: inherit; font-size: 19px; font-weight: 600;
    border-radius: 12px; border: 2px solid var(--wgs-blau); background: #fff; color: var(--wgs-blau);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; cursor: pointer; }
  .steuerung button.primaer { background: var(--wgs-blau); color: #fff; min-width: 200px; }
  .steuerung svg { width: 22px; height: 22px; flex: none; }
  .optionen { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: center; align-items: center; margin-top: 10px; }
  .gruppe { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .glabel { font-size: 17px; font-weight: 600; color: #333; }
  .segment { display: inline-flex; border: 2px solid var(--wgs-blau); border-radius: 12px; overflow: hidden; }
  .segment button { min-height: 48px; padding: 0 16px; font: inherit; font-size: 17px; font-weight: 600;
    border: 0; background: #fff; color: var(--wgs-blau); cursor: pointer; }
  .segment button + button { border-left: 2px solid var(--wgs-blau); }
  .segment button[aria-pressed="true"] { background: var(--wgs-blau); color: #fff; }
  .schalter { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600;
    min-height: 48px; cursor: pointer; user-select: none; }
  .schalter input { width: 26px; height: 26px; accent-color: var(--wgs-blau); margin: 0; }
  .schalter.lehrkraft { color: #555; font-weight: 500; }
  button:focus-visible, .schalter input:focus-visible { outline: 3px solid #ff9f1a; outline-offset: 2px; }
  .fuss { margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--grau); }

  @media (max-width: 700px) {
    .seite { padding: 8px 10px 12px; }
    .kopf { flex-direction: column-reverse; align-items: flex-start; gap: 6px; }
    .phasen button { flex-direction: column; gap: 2px; font-size: 12px; padding: 4px 2px; min-height: 54px; }
    .steuerung { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .steuerung button { min-width: 0; font-size: 17px; }
    #btnVoll { display: none; }
  }
  #pruef { display: none; }
</style>
</head>

<div class="seite">
  <header class="kopf">
    <div>
      <h1>Durchbiegung und Biegerisse bei Stahlbetonbalken</h1>

<script>
"use strict";
/* ================================================================
   Abmessungen (SVG-Einheiten)
   ================================================================ */
const G = {
  x0: 190, x1: 1110,      // Balkenenden
  supL: 230, supR: 1070,  // Auflager
  top: 240, h: 150,       // Oberkante (unbelastet), Balkenhöhe
  cover: 16,              // Betondeckung der Längsbewehrung
  nR: 28                  // Anzahl möglicher Rissstellen
};
G.L = G.supR - G.supL;
G.xm = (G.supL + G.supR) / 2;
G.d = G.L / G.nR;                       // Abstand der möglichen Rissstellen
G.yBot = G.top + G.h;
G.vS = G.h - G.cover;                   // Tiefe der Längsbewehrung

const M_CR = 0.4;         // Rissgrenze als Anteil der größten Biegung
const LAM_P2 = 0.37;      // Laststufe am Ende von Phase 2 (knapp unter der Rissgrenze)
const LAM_BR = 0.43;      // Laststufe ohne Bewehrung
const K_EL = 3.0e-4;      // Krümmung des ungerissenen Balkens je Biegung (überhöht)
const K_RISS = 2.0e-4;    // zusätzliche Krümmung durch die Risse
const W_MAX = 8;          // Rissöffnung an der Unterseite in Feldmitte
const UE_AUF = 0.02;      // so viel Überschuss braucht ein neuer Riss, um ganz hochzulaufen
const ALPHA_MAX = 45 * Math.PI / 180;   // Neigung am Rand des gerissenen Bereichs
const RISSE = Array.from({ length: G.nR }, (_, k) => G.supL + (k + 0.5) * G.d);
const BUEGEL = [];
// Bügel gleichmäßig über die ganze Balkenlänge, jeweils zwischen zwei Rissstellen
for (let x = G.supL + G.d - 2 * G.d * Math.floor((G.supL + G.d - G.x0 - G.cover) / (2 * G.d));
     x <= G.x1 - G.cover; x += 2 * G.d) BUEGEL.push(x);
const LASTPFEILE = Array.from({ length: 14 }, (_, i) => G.supL + G.d + i * 2 * G.d);
const ZEILE1 = 490, ZEILE2 = 536;        // Beschriftungszeilen unter dem Balken
const ML = { y0: 590, h: 85 };          // Momentenlinie (nur Lehrkraft)

const F = {
  beton: "#d5d5d5", rand: "#5c5c5c", riss: "#2b2b2b",
  druck: "#1f6fc5", druckPfeil: "#1565c0", druckText: "#0d47a1",
  zug: "#d32f2f", zugPfeil: "#c62828", zugText: "#b71c1c",
  stahl: "#3a3a3a", stahlHi: "#ef7d00", stahlText: "#8a4b00",
  buegel: "#555555", text: "#222", geist: "#7a7a7a"
};

/* ================================================================
   Ablauf
   ================================================================ */
const DAUER = { 1: 3.0, 2: 3.5, 3: 4.0, 4: 3.5 };   // Sekunden je Phase
const HALT = 1.2;
const S = { phase: 1, tau: 0, halt: 0, modus: "stopp",
  last: "strecke", bew: true, kraefte: true, beschr: true, moment: false };

/* ================================================================
   Hilfsfunktionen
   ================================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const rot = (a, u, v) => ({ x: u * Math.cos(a) - v * Math.sin(a), y: u * Math.sin(a) + v * Math.cos(a) });
const add = (p, q) => ({ x: p.x + q.x, y: p.y + q.y });
const sub = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });
const f1 = v => (Math.round(v * 10) / 10).toString();
const pt = p => f1(p.x) + "," + f1(p.y);
const poly = arr => "M" + arr.map(pt).join("L") + "Z";
const linie = arr => "M" + arr.map(pt).join("L");
function mischFarbe(a, b, t) {
  const h = s => [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16));
  const A = h(a), B = h(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

// Biegung unter voller Last, bezogen auf den Größtwert in Feldmitte (= 1)
function biegung(x, last) {
  const xi = (x - G.supL) / G.L;
  if (xi <= 0 || xi >= 1) return 0;
  return last === "einzel" ? 1 - Math.abs(2 * xi - 1) : 4 * xi * (1 - xi);
}
// halbe Länge des gerissenen Bereichs unter voller Last
function halbeRisszone(last) {
  return (last === "einzel" ? (1 - M_CR) / 2 : Math.sqrt(1 - M_CR) / 2) * G.L;
}
// Laststufe, bei der die Rissgrenze den Anteil f des Weges nach außen erreicht hat
function lastFuerRissgrenze(f, last) {
  return M_CR / (1 - (last === "einzel" ? f : f * f) * (1 - M_CR));
}

/* ================================================================
   Kennwerte der Phase
   ================================================================ */
function phasenWerte() {
  const { phase, tau, bew } = S;
  const e = ease(tau);
  const st = { lambda: 0, lastA: 0, zonenA: 0, stahlHi: 0, kraftA: 0, geistA: 0, bruch: null, gebrochen: false };
  if (phase === 2) {
    st.lambda = LAM_P2 * e; st.lastA = clamp(tau * 3, 0, 1); st.zonenA = e; st.geistA = e;
  } else if (phase === 3) {
    st.lastA = 1; st.zonenA = 1; st.geistA = 1;
    if (bew) {
      const T0 = 0.1;
      if (tau < T0) st.lambda = LAM_P2 + (M_CR - LAM_P2) * (tau / T0);
      else { const u = (tau - T0) / (1 - T0); st.lambda = lastFuerRissgrenze(u * (1.5 - 0.5 * u), S.last); }
    } else {
      st.lambda = LAM_P2 + (LAM_BR - LAM_P2) * ease(tau / 0.25);
      if (tau > 0.25) { const s = ease((tau - 0.25) / 0.75); st.bruch = { vTip: G.h - G.h * 0.85 * s, beta: 0.022 * s }; }
    }
  } else if (phase === 4) {
    st.lastA = 1; st.geistA = 1;
    if (bew) {
      st.lambda = 1; st.zonenA = 1;
      st.stahlHi = ease(tau / 0.4);
      st.kraftA = ease((tau - 0.25) / 0.55);
    } else {
      st.lambda = LAM_BR;
      const a = ease(tau / 0.25), b = ease((tau - 0.2) / 0.6);
      st.bruch = { vTip: G.h * 0.15 * (1 - a), beta: 0.022 + (0.15 - 0.022) * b };
      st.zonenA = 1 - b; st.gebrochen = b > 0.05;
    }
  }
  return st;
}

/* ================================================================
   Verformung: Biegelinie aus der Krümmung, Abbildung (x, Tiefe) -> Bild
   ================================================================ */
function verformung(st) {
  const N = 240, dx = G.L / N, th = [0], w = [0];
  const kap = x => {
    const M = st.lambda * biegung(x, S.last);
    return K_EL * M + (S.bew ? K_RISS * Math.max(0, M - M_CR) : 0);
  };
  for (let i = 1; i <= N; i++) {
    const xa = G.supL + (i - 1) * dx, xb = xa + dx;
    th[i] = th[i - 1] - (kap(xa) + kap(xb)) / 2 * dx;
    w[i] = w[i - 1] + (th[i - 1] + th[i]) / 2 * dx;
  }
  const t0 = -w[N] / G.L;
  for (let i = 0; i <= N; i++) { th[i] += t0; w[i] += t0 * i * dx; }
  function wt(x) {
    if (x <= G.supL) return { w: th[0] * (x - G.supL), t: th[0] };
    if (x >= G.supR) return { w: th[N] * (x - G.supR), t: th[N] };
    const u = (x - G.supL) / dx, i = Math.min(N - 1, Math.floor(u)), f = u - i;
    return { w: w[i] + (w[i + 1] - w[i]) * f, t: th[i] + (th[i + 1] - th[i]) * f };
  }
  function p0(x, v) {
    const q = wt(x), a = Math.atan(q.t);
    return { x: x + (G.h - v) * Math.sin(a), y: G.yBot + q.w - (G.h - v) * Math.cos(a) };
  }
  let bruch = null;
  if (st.bruch) {   // ohne Bewehrung: zwei Hälften drehen um den Rissgrund in Feldmitte
    const b = st.bruch.beta;
    const Lc = p0(G.supL, G.h), H = p0(G.xm, st.bruch.vTip);
    const links = p => add(Lc, rot(b, p.x - Lc.x, p.y - Lc.y));
    const Hs = links(H);
    const rechts = p => add(Hs, rot(-b, p.x - H.x, p.y - H.y));
    bruch = (p, seite) => seite === "L" ? links(p) : rechts(p);
  }
  const abb = (x, v, seite) => {
    const p = p0(x, v);
    return bruch ? bruch(p, seite || (x < G.xm ? "L" : "R")) : p;
  };
  return { wt, abb, wMitte: wt(G.xm).w };
}

/* ================================================================
   Risse und Druckzone
   ================================================================ */
// Tiefe der Unterkante der Druckzone an der Stelle x
function druckzone(x, st) {
  const ue = st.lambda * biegung(x, S.last) - M_CR;
  if (!S.bew || ue <= 0) return G.h / 2;
  return G.h * (0.5 - 0.2 * ue / (1 - M_CR));
}
function risse(st) {
  const R = [];
  if (!S.bew) return R;
  const H = halbeRisszone(S.last);
  RISSE.forEach((xb, k) => {
    const ue = st.lambda * biegung(xb, S.last) - M_CR;
    if (ue <= 0) return;
    const tipV = druckzone(xb, st) + 6;                // endet knapp unter der Druckzone
    const hc = (G.h - tipV) * Math.min(1, ue / UE_AUF);
    const wb = W_MAX * ue / (1 - M_CR);
    const r = Math.min(1, Math.abs(xb - G.xm) / H);
    const alpha = ALPHA_MAX * Math.pow(r, 1.5);
    const s = xb < G.xm ? 1 : -1;                      // oberes Ende Richtung Feldmitte
    const xt = xb + s * hc * Math.tan(alpha);
    R.push({ k, xb, xt, wb, hc, vTip: G.h - hc, alpha, ue });
  });
  return R;
}

/* ================================================================
   Zeichnen
   ================================================================ */
function pfeil(p1, p2, w, hl, hw) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y, L = Math.hypot(dx, dy);
  if (L < 2) return "";
  const ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const k = Math.min(hl, L * 0.6);
  const bx = p2.x - ux * k, by = p2.y - uy * k;
  return poly([
    { x: p1.x + px * w / 2, y: p1.y + py * w / 2 }, { x: bx + px * w / 2, y: by + py * w / 2 },
    { x: bx + px * hw / 2, y: by + py * hw / 2 }, p2,
    { x: bx - px * hw / 2, y: by - py * hw / 2 }, { x: bx - px * w / 2, y: by - py * w / 2 },
    { x: p1.x - px * w / 2, y: p1.y - py * w / 2 }]);
}

function lager(p, los) {
  const x = p.x, y = p.y, w = 24, hg = 36;
  let s = `<path d="M${f1(x)},${f1(y)}L${f1(x - w)},${f1(y + hg)}L${f1(x + w)},${f1(y + hg)}Z" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>`;
  let b = y + hg;
  if (los) { s += `<line x1="${f1(x - 32)}" y1="${f1(b + 8)}" x2="${f1(x + 32)}" y2="${f1(b + 8)}" stroke="#222" stroke-width="2.5"/>`; b += 8; }
  else s += `<line x1="${f1(x - 32)}" y1="${f1(b)}" x2="${f1(x + 32)}" y2="${f1(b)}" stroke="#222" stroke-width="2.5"/>`;
  for (let k = 0; k < 6; k++) {
    const xx = x - 26 + k * 11;
    s += `<line x1="${f1(xx)}" y1="${f1(b)}" x2="${f1(xx - 9)}" y2="${f1(b + 11)}" stroke="#222" stroke-width="1.6"/>`;
  }
  return s;
}

// Linie entlang der Tiefe v von xa bis xb (im verformten Balken)
function laengs(D, xa, xb, v, seite, schritt = 10) {
  const n = Math.max(2, Math.ceil(Math.abs(xb - xa) / schritt));
  return Array.from({ length: n + 1 }, (_, i) => D.abb(xa + (xb - xa) * i / n, v, seite));
}
function quer(D, x, va, vb, seite) {
  return Array.from({ length: 7 }, (_, i) => D.abb(x, va + (vb - va) * i / 6, seite));
}

// Umriss eines Balkenstücks von xa bis xb
function umriss(D, xa, xb, seite) {
  return [...laengs(D, xa, xb, 0, seite), ...quer(D, xb, 0, G.h, seite),
          ...laengs(D, xb, xa, G.h, seite), ...quer(D, xa, G.h, 0, seite)];
}

// Druck- und Zugzone als Flächen mit nach außen schwächer werdender Färbung
function zonen(D, st, xa, xb, seite, id) {
  const op = x => st.zonenA * (0.18 + 0.42 * biegung(x, S.last));
  const stops = Array.from({ length: 21 }, (_, i) => {
    const x = G.supL + G.L * i / 20;
    return `<stop offset="${i / 20}" stop-opacity="${op(x).toFixed(3)}"`;
  });
  const grad = (gid, farbe) => `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${G.supL}" y1="0" x2="${G.supR}" y2="0">` +
    stops.map(s => s + ` stop-color="${farbe}"/>`).join("") + `</linearGradient>`;
  const n = Math.ceil((xb - xa) / 8);
  const xs = Array.from({ length: n + 1 }, (_, i) => xa + (xb - xa) * i / n);
  const grenze = xs.map(x => D.abb(x, druckzone(x, st), seite));
  const oben = xs.map(x => D.abb(x, 0, seite));
  const unten = xs.map(x => D.abb(x, G.h, seite));
  return `<defs>${grad("gD" + id, F.druck)}${grad("gZ" + id, F.zug)}</defs>` +
    `<path d="${poly([...oben, ...grenze.slice().reverse()])}" fill="url(#gD${id})"/>` +
    `<path d="${poly([...grenze, ...unten.slice().reverse()])}" fill="url(#gZ${id})"/>`;
}

function zeichne() {
  const st = phasenWerte();
  const D = verformung(st);
  const R = risse(st);
  const druckL = [];            // Beschriftungen [x, y, Text, Klasse, Ausrichtung, Farbe]
  let svg = "";

  // Lage ohne Last (gestrichelt)
  if (st.geistA > 0.01) {
    svg += `<line x1="${G.x0}" y1="${G.top}" x2="${G.x1}" y2="${G.top}" stroke="${F.geist}" stroke-width="2" stroke-dasharray="12 8" opacity="${st.geistA}"/>`;
  }

  // Beton und Zonen
  if (st.bruch) {
    for (const [xa, xb, s] of [[G.x0, G.xm, "L"], [G.xm, G.x1, "R"]]) {
      svg += `<path d="${poly(umriss(D, xa, xb, s))}" fill="${F.beton}"/>`;
      if (st.zonenA > 0.01) svg += zonen(D, st, Math.max(xa, G.supL), Math.min(xb, G.supR), s, s);
    }
    // Außenrand ohne die Rissflächen oberhalb der Rissspitze
    const vT = st.bruch.vTip;
    const randL = [...quer(D, G.xm, vT, G.h, "L"), ...laengs(D, G.xm, G.x0, G.h, "L"),
                   ...quer(D, G.x0, G.h, 0, "L"), ...laengs(D, G.x0, G.xm, 0, "L")];
    const randR = [...quer(D, G.xm, vT, G.h, "R"), ...laengs(D, G.xm, G.x1, G.h, "R"),
                   ...quer(D, G.x1, G.h, 0, "R"), ...laengs(D, G.x1, G.xm, 0, "R")];
    for (const r of [randL, randR]) svg += `<path d="${linie(r)}" fill="none" stroke="${F.rand}" stroke-width="2.5" stroke-linejoin="round"/>`;
  } else {
    svg += `<path d="${poly(umriss(D, G.x0, G.x1))}" fill="${F.beton}"/>`;
    if (st.zonenA > 0.01) svg += zonen(D, st, G.supL, G.supR, undefined, "M");
    svg += `<path d="${poly(umriss(D, G.x0, G.x1))}" fill="none" stroke="${F.rand}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }

  // Risse: Spalt (keilförmig) mit dunklen Rändern
  for (const r of R) {
    const lk = [], rk = [];
    for (let i = 0; i <= 8; i++) {
      const f = i / 8, v = G.h - r.hc * f, x = r.xb + (r.xt - r.xb) * f;
      lk.push(D.abb(x - r.wb / 2 * (1 - f), v));
      rk.push(D.abb(x + r.wb / 2 * (1 - f), v));
    }
    const lu = D.abb(r.xb - r.wb / 2, G.h + 3), ru = D.abb(r.xb + r.wb / 2, G.h + 3);
    svg += `<path d="${poly([lu, ...lk, ...rk.slice().reverse(), ru])}" fill="#fff"/>`;
    svg += `<path d="${linie(lk)}" fill="none" stroke="${F.riss}" stroke-width="1.6" stroke-linejoin="round"/>`;
    svg += `<path d="${linie(rk)}" fill="none" stroke="${F.riss}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  // Bewehrung: Bügel und Längsbewehrung
  if (S.bew) {
    const hi = st.stahlHi;
    const fb = mischFarbe(F.buegel, F.stahlHi, hi), fs = mischFarbe(F.stahl, F.stahlHi, hi);
    for (const xs of BUEGEL) {
      const a = D.abb(xs, 9), b = D.abb(xs, G.vS + 6);
      svg += `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="${fb}" stroke-width="${2 + 1.2 * hi}" stroke-linecap="round"/>`;
    }
    svg += `<path d="${linie(laengs(D, G.x0 + 8, G.x1 - 8, G.vS))}" fill="none" stroke="${fs}" stroke-width="${4 + 3 * hi}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  // Auflager
  const kL = D.abb(G.supL, G.h, "L"), kR = D.abb(G.supR, G.h, "R");
  svg += lager(kL, false) + lager({ x: kR.x, y: G.yBot }, true);

  // Last
  if (st.lastA > 0.01) {
    let s = "";
    if (S.last === "strecke") {
      const koepfe = [];
      for (const x of LASTPFEILE) {
        const o = D.abb(x, 0);
        const spitze = { x: o.x, y: o.y - 3 }, fuss = { x: o.x, y: o.y - 62 };
        koepfe.push(fuss);
        s += `<path d="${pfeil(fuss, spitze, 3.5, 14, 14)}" fill="${F.text}"/>`;
      }
      s += `<path d="${linie(koepfe)}" fill="none" stroke="${F.text}" stroke-width="3"/>`;
      druckL.push([LASTPFEILE[0] - 4, koepfe[0].y - 12, "Streckenlast", "lbl", "start", F.text]);
    } else {
      const o = D.abb(G.xm, 0, "L");
      const spitze = { x: o.x, y: o.y - 3 }, fuss = { x: o.x, y: o.y - 95 };
      s += `<path d="${pfeil(fuss, spitze, 9, 26, 26)}" fill="${F.text}"/>`;
      druckL.push([o.x + 20, Math.min(fuss.y + 20, G.top - 30), "Einzellast", "lbl", "start", F.text]);
    }
    svg += `<g opacity="${st.lastA}">${s}</g>`;
  }

  // Kräfte (Phase 4, mit Bewehrung)
  const zeigeKraft = S.bew && S.kraefte && st.kraftA > 0.01;
  let kraftInfo = null;
  if (S.bew && st.lambda >= 1 && S.phase === 4) {
    const q = D.wt(G.xm), a = Math.atan(q.t), ex = { x: Math.cos(a), y: Math.sin(a) };
    const halb = 95;
    const cD = D.abb(G.xm, druckzone(G.xm, st) / 2), cZ = D.abb(G.xm, G.vS);
    kraftInfo = { cD, cZ, halb, ex };
  }
  if (zeigeKraft && kraftInfo) {
    const { cD, cZ, ex } = kraftInfo, hb = kraftInfo.halb * st.kraftA;
    const dA = { x: cD.x + ex.x * hb, y: cD.y + ex.y * hb }, dE = { x: cD.x - ex.x * hb, y: cD.y - ex.y * hb };
    const zA = { x: cZ.x - ex.x * hb, y: cZ.y - ex.y * hb }, zE = { x: cZ.x + ex.x * hb, y: cZ.y + ex.y * hb };
    const halo = ` stroke="#fff" stroke-width="3" paint-order="stroke"`;
    svg += `<path class="kraft" data-kraft="D" data-laenge="${(2 * hb).toFixed(2)}" d="${pfeil(dA, dE, 8, 24, 24)}" fill="${F.druckPfeil}"${halo}/>`;
    svg += `<path class="kraft" data-kraft="Z" data-laenge="${(2 * hb).toFixed(2)}" d="${pfeil(zA, zE, 8, 24, 24)}" fill="${F.zugPfeil}"${halo}/>`;
  }

  // Beschriftung
  const L = [];   // [x, y, Text, Klasse, Ausrichtung, Farbe, Führungslinie?]
  const fuehr = (a, b, farbe) => `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="${farbe || "#444"}" stroke-width="1.6"/>`;
  let linien = "";
  if (S.beschr) {
    L.push(...druckL);
    L.push([kL.x - 36, G.yBot + 32, "Auflager", "lbl", "end", F.text]);
    if (S.bew) {
      const sf = st.stahlHi > 0.5 ? F.stahlText : F.text;
      const pS = D.abb(G.x0 + 22, G.vS, "L");
      L.push([178, pS.y + 7, "Längsbewehrung", "lbl", "end", sf]);
      linien += fuehr({ x: 182, y: pS.y }, pS);
      const pB = D.abb(BUEGEL[0], G.h * 0.42, "L");
      L.push([178, pB.y + 7, "Bügel", "lbl", "end", sf]);
      linien += fuehr({ x: 182, y: pB.y }, pB);
    }
    if (st.geistA > 0.5) L.push([178, G.top + 7, "Lage ohne Last", "klein", "end", F.geist]);
    if (st.zonenA > 0.3) {
      // Linienende im Farbbereich, mittig zwischen dem letzten Bügel und dem Rand der Färbung
      const xz = G.supR - 14;
      const pD = D.abb(xz, G.h * 0.22, "R"), pZ = D.abb(xz, G.h * 0.78, "R");
      L.push([1132, pD.y + 7, "Druckzone", "lbl", "start", F.druckText]);
      L.push([1132, pZ.y + 7, "Zugzone", "lbl", "start", F.zugText]);
      linien += fuehr({ x: 1128, y: pD.y }, pD, F.druckText) + fuehr({ x: 1128, y: pZ.y }, pZ, F.zugText);
    }
    if (S.bew && R.length && S.phase >= 3) {
      const xa = R[0].xb, xe = R[R.length - 1].xb;
      L.push([(G.x0 + xa) / 2, ZEILE1, "ungerissen", "lbl", "middle", F.text]);
      L.push([(xe + G.x1) / 2, ZEILE1, "ungerissen", "lbl", "middle", F.text]);
      const xS = schubStelle(R, -1);
      const xBz = (xS + G.xm - 62) / 2;
      const rB = R.reduce((b, r) => Math.abs(r.xb - xBz) < Math.abs(b.xb - xBz) ? r : b, R[0]);
      L.push([xBz, ZEILE1, "Biegerisse", "lbl", "middle", F.text]);
      const u = D.abb(rB.xb, G.h);
      linien += fuehr({ x: xBz + (rB.xb - xBz) * 0.3, y: ZEILE1 - 20 }, { x: u.x, y: u.y + 4 });
    }
    if (!S.bew && S.phase === 3 && st.bruch) {
      const u = D.abb(G.xm, G.h, "L");
      L.push([G.xm, ZEILE1, "Riss", "lbl", "middle", F.text]);
      linien += fuehr({ x: G.xm, y: ZEILE1 - 20 }, { x: u.x, y: u.y + 5 });
    }
    if (!S.bew && st.gebrochen) L.push([G.xm, ZEILE2 + 6, "Bruch!", "gross", "middle", F.zugText]);
  }
  if (zeigeKraft && kraftInfo) {
    const { cD, halb } = kraftInfo;
    L.push([cD.x - halb - 22, cD.y + 7, "Druckkraft", "lbl", "end", F.druckText]);
    // direkt unter dem Zugpfeil, knapp unter der Balkenunterkante
    const uZ = D.abb(G.xm, G.h, "L");
    L.push([G.xm, uZ.y + 27, "Zugkraft", "lbl", "middle", F.zugText]);
    // Hinweis Druckkraft = Zugkraft
    L.push([G.xm, ZEILE2, "Druckkraft = Zugkraft", "notiz", "middle", F.text]);
    // Schub an den schrägen Rissen
    for (const seite of [-1, 1]) {
      const xs = schubStelle(R, seite);
      const u = D.abb(xs, G.h);
      L.push([xs, ZEILE2, "Schub", "lbl", "middle", F.text]);
      linien += fuehr({ x: xs, y: ZEILE2 - 20 }, { x: u.x, y: u.y + 5 });
    }
  }
  const op = zeigeKraft ? st.kraftA : 1;
  let texte = linien;
  for (const [x, y, t, cls, anc, farbe] of L) {
    const kraftText = ["Druckkraft", "Zugkraft", "Druckkraft = Zugkraft", "Schub"].includes(t);
    texte += `<text x="${f1(x)}" y="${f1(y)}" class="${cls}" text-anchor="${anc}" fill="${farbe}"${kraftText ? ` opacity="${op}"` : ""}>${t}</text>`;
  }
  if (zeigeKraft) {
    const w = 290;
    texte = `<rect x="${G.xm - w / 2}" y="${ZEILE2 - 24}" width="${w}" height="34" rx="6" fill="#fff" stroke="#222" stroke-width="1.6" opacity="${op}"/>` + texte;
  }
  svg += texte;

  if (S.moment) svg += momentenlinie(st);

  document.getElementById("grafik").innerHTML = svgStil() + svg;
  return { st, D, R, kraftInfo };
}

// Mittlere Lage der drei äußeren (schrägen) Risse auf einer Seite (-1 links, +1 rechts)
function schubStelle(R, seite) {
  const t = seite < 0 ? R.slice(0, 3) : R.slice(-3);
  if (!t.length) return seite < 0 ? G.supL + 100 : G.supR - 100;
  return t.reduce((s, r) => s + r.xb, 0) / t.length;
}

/* Momentenlinie unter dem Balken mit waagerechter Linie für die Rissgrenze (nur Lehrkraft) */
function momentenlinie(st) {
  const { y0, h: hM } = ML;
  const yCr = y0 + hM * M_CR, xa = G.supL, xb = G.supR, N = 84;
  const kurve = [], ueber = [];
  for (let k = 0; k <= N; k++) {
    const x = xa + (xb - xa) * k / N;
    const M = st.lambda * biegung(x, S.last);
    kurve.push({ x, y: y0 + hM * M });
    ueber.push({ x, y: y0 + hM * Math.max(M, M_CR) });
  }
  let s = `<line x1="${G.x0}" y1="${y0 - 22}" x2="${G.x1}" y2="${y0 - 22}" stroke="#bbb" stroke-width="1"/>`;
  s += `<path d="${poly([{ x: xa, y: y0 }, ...kurve, { x: xb, y: y0 }])}" fill="#ececec"/>`;
  if (st.lambda > M_CR) s += `<path d="${poly([{ x: xa, y: yCr }, ...ueber, { x: xb, y: yCr }])}" fill="${F.zug}" fill-opacity="0.3"/>`;
  s += `<path d="${linie(kurve)}" fill="none" stroke="#222" stroke-width="2.4" stroke-linejoin="round"/>`;
  s += `<line x1="${xa}" y1="${y0}" x2="${xb}" y2="${y0}" stroke="#222" stroke-width="1.6"/>`;
  s += `<line x1="${xa - 20}" y1="${yCr}" x2="${xb + 20}" y2="${yCr}" stroke="${F.zugPfeil}" stroke-width="2" stroke-dasharray="10 7"/>`;
  s += `<text x="${xb + 34}" y="${y0 + 7}" class="klein" fill="#222">Momentenlinie</text>`;
  s += `<text x="${xb + 34}" y="${yCr + 7}" class="klein" fill="${F.zugText}">Rissmoment</text>`;
  return s;
}

function svgStil() {
  return `<style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .lbl { font-size: 21px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
    .klein { font-size: 18px; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .notiz { font-size: 21px; font-weight: 700; }
    .gross { font-size: 30px; font-weight: 700; }
  </style>`;
}

/* ================================================================
   Texte der Phasen
   ================================================================ */
function phasenTexte() {
  const b = S.bew, e = S.last === "einzel";
  switch (S.phase) {
    case 1: return ["Phase 1: Unbelasteter Balken",
      "Der Balken liegt auf zwei Auflagern. Ohne Last ist er gerade. " +
      (b ? "Unten liegt die Längsbewehrung, senkrechte Bügel umschließen sie." : "Dieser Balken hat keine Bewehrung, er besteht nur aus Beton.")];
    case 2: return ["Phase 2: Last wird aufgebracht",
      "Der Balken biegt sich nach unten durch, in Feldmitte am stärksten. Oben wird der Beton zusammengedrückt (Druckzone), unten gedehnt (Zugzone). Je kräftiger die Farbe, desto größer Druck und Zug. Noch gibt es keine Risse."];
    case 3: return b
      ? ["Phase 3: Beton reißt",
         "Beton hält Zug kaum aus. In der Zugzone reißt er: zuerst in Feldmitte, wo die Biegung am größten ist, dann weiter außen. Zu den Auflagern hin verlaufen die Risse schräg. Direkt an den Auflagern bleibt der Beton ungerissen. " +
         (e ? "Bei der Einzellast reißt ein kürzerer Bereich." : "Bei der Streckenlast reißt ein längerer Bereich.")]
      : ["Phase 3: Beton reißt",
         "Ohne Stahl hält nichts den Riss in Feldmitte zusammen. Er öffnet sich immer weiter und läuft nach oben."];
    default: return b
      ? ["Phase 4: Stahl wirkt",
         "Der Stahl übernimmt die Zugkraft. Die Risse wachsen nicht weiter, sie bleiben fein und verteilt. Oben wirkt im Beton die Druckkraft, unten im Stahl die Zugkraft: gleich groß und entgegengesetzt. Nahe den Auflagern wirkt zusätzlich Schub, die Bügel kreuzen die schrägen Risse."]
      : ["Phase 4: Der Balken bricht",
         "Der Riss hat den Balken ganz durchtrennt. Ohne Stahl bricht der Balken plötzlich."];
  }
}

/* ================================================================
   Oberfläche
   ================================================================ */
const $ = id => document.getElementById(id);
let letzteTexte = "";
function aktualisiereUI() {
  const [titel, text] = phasenTexte();
  if (titel + text !== letzteTexte) { $("phasentitel").textContent = titel; $("phasentext").textContent = text; letzteTexte = titel + text; }
  document.querySelectorAll(".phasen button").forEach(b => {
    const p = +b.dataset.phase;
    b.classList.toggle("aktiv", p === S.phase);
    b.classList.toggle("fertig", p < S.phase);
    b.setAttribute("aria-current", p === S.phase ? "step" : "false");
  });
  $("chip4").textContent = S.bew ? "Stahl wirkt" : "Bruch";
  $("legStahl").hidden = !S.bew;
  const laeuft = S.modus !== "stopp", ende = S.phase === 4 && S.tau >= 1;
  $("txtPlay").textContent = laeuft ? "Pause" : (ende ? "Nochmal" : "Abspielen");
  $("icoPlay").setAttribute("d", laeuft ? "M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" : "M7 4v16l13-8z");
  document.querySelectorAll("[data-last]").forEach(b => b.setAttribute("aria-pressed", b.dataset.last === S.last));
  document.querySelectorAll("[data-bew]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.bew === "1") === S.bew));
  $("chkKraefte").checked = S.kraefte; $("chkBeschr").checked = S.beschr; $("chkMoment").checked = S.moment;
  $("grafik").setAttribute("viewBox", S.moment ? "0 115 1300 600" : "0 115 1300 445");
}
function neuZeichnen() { const r = zeichne(); aktualisiereUI(); return r; }

function abspielen() { if (S.phase === 4 && S.tau >= 1) { S.phase = 1; S.tau = 0; } S.halt = 0; S.modus = "alle"; start(); }
function pause() { S.modus = "stopp"; neuZeichnen(); }
function vor() {
  if (S.phase < 4) { S.phase++; S.tau = 0; S.halt = 0; S.modus = "eine"; start(); }
  else { S.tau = 1; S.modus = "stopp"; neuZeichnen(); }
}
function zurueck() { S.modus = "stopp"; if (S.phase > 1) S.phase--; S.tau = 1; neuZeichnen(); }
function neustart() { S.phase = 1; S.tau = 0; S.halt = 0; S.modus = "alle"; start(); }
function springe(p) { S.phase = p; S.tau = 0; S.halt = 0; S.modus = "eine"; start(); }

let rafId = null, tAlt = null;
function start() { neuZeichnen(); if (rafId === null) { tAlt = null; rafId = requestAnimationFrame(schritt); } }
function schritt(t) {
  rafId = null;
  if (S.modus === "stopp") { neuZeichnen(); return; }
  const dt = tAlt === null ? 0 : Math.min(0.1, (t - tAlt) / 1000);
  tAlt = t;
  if (S.tau < 1) S.tau = Math.min(1, S.tau + dt / DAUER[S.phase]);
  else if (S.modus === "eine" || S.phase === 4) S.modus = "stopp";
  else { S.halt += dt; if (S.halt >= HALT) { S.phase++; S.tau = 0; S.halt = 0; } }
  neuZeichnen();
  if (S.modus !== "stopp") rafId = requestAnimationFrame(schritt);
}

/* Prüfdaten für die automatische Kontrolle (?pruef=1) */
function pruefDaten(r) {
  const boxen = [...document.querySelectorAll("#grafik text")].map(t => {
    const b = t.getBBox(); return { t: t.textContent, x: b.x, y: b.y, w: b.width, h: b.height };
  });
  const ueberlapp = [];
  for (let i = 0; i < boxen.length; i++) for (let j = i + 1; j < boxen.length; j++) {
    const a = boxen[i], b = boxen[j];
    if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) ueberlapp.push([a.t, b.t]);
  }
  const kr = [...document.querySelectorAll("path.kraft")].map(p => ({ k: p.dataset.kraft, l: +p.dataset.laenge }));
  return { phase: S.phase, last: S.last, bew: S.bew, lambda: r.st.lambda,
    risse: r.R.map(q => ({ k: q.k, xb: +q.xb.toFixed(1), xt: +q.xt.toFixed(1), grad: +(q.alpha * 180 / Math.PI).toFixed(1),
      wb: +q.wb.toFixed(2), hc: +q.hc.toFixed(1), vTip: +q.vTip.toFixed(1), dz: +druckzone(q.xt, r.st).toFixed(1) })),
    buegel: BUEGEL, vS: G.vS, h: G.h, xm: G.xm, supL: G.supL, supR: G.supR, x0: G.x0, x1: G.x1,
    kraefte: kr, durchbiegungMitte: +r.D.wMitte.toFixed(1), textBoxen: boxen, ueberlapp };
}

function init() {
  const p = new URLSearchParams(location.search);
  if (p.has("phase")) S.phase = clamp(parseInt(p.get("phase"), 10) || 1, 1, 4);
  if (p.has("t")) S.tau = clamp(parseFloat(p.get("t")) || 0, 0, 1);
  else if (p.has("phase")) S.tau = 1;
  if (p.get("last") === "einzel") S.last = "einzel";
  if (p.get("bewehrung") === "0") S.bew = false;
  if (p.get("kraefte") === "0") S.kraefte = false;
  if (p.get("beschriftung") === "0") S.beschr = false;
  if (p.get("momente") === "1") S.moment = true;

  document.querySelectorAll(".phasen button").forEach(b => b.addEventListener("click", () => springe(+b.dataset.phase)));
  $("btnPlay").addEventListener("click", () => S.modus === "stopp" ? abspielen() : pause());
  $("btnVor").addEventListener("click", vor);
  $("btnZurueck").addEventListener("click", zurueck);
  $("btnNeu").addEventListener("click", neustart);
  document.querySelectorAll("[data-last]").forEach(b => b.addEventListener("click", () => { S.last = b.dataset.last; neuZeichnen(); }));
  document.querySelectorAll("[data-bew]").forEach(b => b.addEventListener("click", () => { S.bew = b.dataset.bew === "1"; neuZeichnen(); }));
  $("chkKraefte").addEventListener("change", e => { S.kraefte = e.target.checked; neuZeichnen(); });
  $("chkBeschr").addEventListener("change", e => { S.beschr = e.target.checked; neuZeichnen(); });
  $("chkMoment").addEventListener("change", e => { S.moment = e.target.checked; neuZeichnen(); });

  const voll = $("btnVoll"), de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen;
  if (!req) voll.style.display = "none";
  voll.addEventListener("click", () => {
    const fe = document.fullscreenElement || document.webkitFullscreenElement;
    if (fe) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else req.call(de);
  });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" && e.key === " ") return;
    if (e.key === " ") { e.preventDefault(); S.modus === "stopp" ? abspielen() : pause(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); vor(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); zurueck(); }
    else if (e.key === "r" || e.key === "R") neustart();
  });

  const r = neuZeichnen();
  if (p.get("pruef") === "1") $("pruef").textContent = JSON.stringify(pruefDaten(r));
  if (p.get("play") === "1") abspielen();
}
init();
</script>
